# ============================================================================
# Deploy Sales Performance via DCM Projects
# ============================================================================
# Two corrections to the CI/CD pattern in the February best-practices guide,
# both of which matter in production:
#
# 1. AUTHENTICATION. That guide stored a password as SNOWCLI_PW. Snowflake's
#    CI/CD guidance explicitly says password authentication is supported for
#    legacy workflows but is NOT recommended for production. This workflow uses
#    key-pair authentication instead. Workload identity federation via OIDC is
#    better still where available, because it removes the stored secret
#    entirely.
#
# 2. NO BARE `--replace`. That guide ran `snow streamlit deploy --replace`.
#    --replace performs a create-or-replace, which CAN DROP THE GRANTS on the
#    app. For a production app with a carefully managed viewer role that
#    silently revokes business users' access. DCM's plan/deploy reconciles the
#    object instead, and keeps the grants declared in access.sql as part of the
#    same managed unit.
#
# The PLAN step runs on every pull request so reviewers can see the changeset
# before it is applied. DEPLOY runs only on the protected branch.
#
# ----------------------------------------------------------------------------
# THIS WORKFLOW SKIPS ITSELF UNTIL YOU CONFIGURE CREDENTIALS
# ----------------------------------------------------------------------------
# This repository is handed to teams who will point it at their own account, so
# the workflow cannot ship with working credentials. Rather than fail on every
# push with an opaque `Connection default is not configured`, the preflight job
# below detects the missing secrets and skips the rest with a summary naming
# exactly what to set. A skipped job does not fail the run.
#
# To activate it, set these repository secrets (Settings > Secrets and
# variables > Actions) and create a `dev` environment if you want the plan job
# gated too:
#
#   SNOWFLAKE_ACCOUNT        e.g. MYORG-MYACCOUNT
#   SNOWFLAKE_USER           the CI service user
#   SNOWFLAKE_DEPLOY_ROLE    dedicated deployer role; NOT ACCOUNTADMIN
#   SNOWFLAKE_WAREHOUSE      warehouse for the deploy session
#   SNOWFLAKE_PRIVATE_KEY    unencrypted PKCS#8 private key, full PEM body
#
# You must also replace the MYORG-MYACCOUNT and ANALYTICS_WH placeholders in
# demo_app/manifest.yml, and create the APP_DEPLOYER_PROD role its prod target
# names. The deploying role permanently becomes the role the app runs as --
# Streamlit ownership cannot be transferred after creation -- so that role is a
# governance decision, not a convenience.
# ============================================================================

name: Deploy Sales Performance

on:
  pull_request:
    paths:
      - 'demo_app/**'
  push:
    branches: [main]
    paths:
      - 'demo_app/**'
  # Allows a dry run of the preflight without touching demo_app/.
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # --------------------------------------------------------------------------
  # PREFLIGHT — is this repository actually wired to an account?
  # --------------------------------------------------------------------------
  # A separate job because the `secrets` context is not available in job-level
  # `if:` conditions. Exposing a boolean output is the supported way to gate
  # downstream jobs on secret availability.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for Snowflake credentials
        id: check
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_DEPLOY_ROLE: ${{ secrets.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          missing=()
          for name in SNOWFLAKE_ACCOUNT SNOWFLAKE_USER SNOWFLAKE_DEPLOY_ROLE \
                      SNOWFLAKE_WAREHOUSE SNOWFLAKE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo '## Preflight: credentials present' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'configured=false' >> "$GITHUB_OUTPUT"
          {
            echo '## Preflight: workflow skipped — not wired to an account'
            echo
            echo 'This repository ships as reference guidance, so it has no'
            echo 'credentials of its own. The plan and deploy jobs were skipped'
            echo 'rather than failed.'
            echo
            echo 'Missing repository secrets:'
            for name in "${missing[@]}"; do echo "- \`$name\`"; done
            echo
            echo 'See the header of `.github/workflows/deploy.yml` for the full'
            echo 'activation checklist, including the manifest placeholders and'
            echo 'the deployer role that must exist first.'
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # PLAN — on pull requests. Never mutates anything.
  # --------------------------------------------------------------------------
  # No `environment:` here deliberately. An environment exists to carry an
  # approval gate, and a plan changes nothing that needs approving; declaring
  # one only adds a dependency on that environment existing.
  plan:
    needs: preflight
    if: github.event_name == 'pull_request' && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Snowflake CLI
        # container runtime support requires 3.14.0+
        run: pip install 'snowflake-cli>=3.14.0'

      - name: Configure key-pair authentication
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      - name: Clean stray bytecode before packaging assets
        # The asset glob must be ** to preserve the utils/ package structure,
        # and ** has no negation, so __pycache__ would otherwise be deployed.
        run: find . -name '__pycache__' -type d -prune -exec rm -rf {} + || true

      - name: DCM plan
        working-directory: demo_app
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/rsa_key.p8
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          snow dcm plan --target dev --save-output

      - name: Publish the changeset for review
        working-directory: demo_app
        run: |
          {
            echo '## DCM plan — DEV'
            echo '```'
            cat out/plan_results.json 2>/dev/null || echo 'no plan output produced'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------------
  # DEPLOY — on merge to main. Gated by the GitHub environment.
  # --------------------------------------------------------------------------
  deploy:
    needs: preflight
    if: github.event_name == 'push' && needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in repository settings.
    # That is the approval gate; this workflow deliberately does not implement
    # its own.
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Snowflake CLI
        run: pip install 'snowflake-cli>=3.14.0'

      - name: Configure key-pair authentication
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.snowflake
          printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/rsa_key.p8
          chmod 600 ~/.snowflake/rsa_key.p8

      - name: Clean stray bytecode before packaging assets
        run: find . -name '__pycache__' -type d -prune -exec rm -rf {} + || true

      - name: DCM deploy
        working-directory: demo_app
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/rsa_key.p8
          PYTHONDONTWRITEBYTECODE: '1'
        # The prod target's project_owner IS the functional app owner role.
        # Streamlit ownership cannot be transferred after creation, so the
        # deploying role permanently becomes the role the app runs as.
        #
        # Deploy from the commit path, not a branch path. DCM retains no commit
        # hash of its own -- see .github/scripts/verify_provenance.py -- so a
        # branch path leaves a moving pointer and the deployment becomes
        # unauditable. ${GITHUB_SHA} is the commit under test.
        run: |
          snow dcm deploy --target prod --alias "${GITHUB_SHA::12}"

      # The provenance check. If the deployment cannot be traced to a commit,
      # the app must not be treated as certified. Failing here keeps the
      # catalog honest.
      #
      # This deliberately does NOT just read git_commit_hash off the app
      # object. That column is empty for every DCM deployment, so the obvious
      # check rejects the best-governed path there is. The script accepts
      # provenance from either source -- the executable form of the rule
      # "gate on provenance = NONE, never on git_commit_hash IS NULL".
      - name: Verify Git provenance landed
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/rsa_key.p8
        run: |
          python .github/scripts/verify_provenance.py \
            --app     RETAIL_DEMO.SERVE.SALES_PERFORMANCE \
            --project GOVERNANCE.PROJECTS.SALES_PERFORMANCE_PROD

      - name: Refresh the governance inventory
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/rsa_key.p8
        run: snow sql -q "CALL GOVERNANCE.APPS.SP_AUDIT_STREAMLIT_APPS()"
